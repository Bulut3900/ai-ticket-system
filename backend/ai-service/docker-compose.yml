services:
  # ============ Nacos 服务注册中心 ============
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - ai-network

  # ============ MySQL 数据库 ============
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ticket_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d    # 首次启动可完成初始化
    networks:
      - ai-network

  # ============ Redis Stack 向量库 ============
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ai-network

  # ============ Gateway 网关 ============
  gateway:
    build: ./gateway
    container_name: gateway
    restart: always
    ports:
      - "9000:9000"
    depends_on:
      - nacos
    environment:
      NACOS_ADDR: nacos:8848
    networks:
      - ai-network

  # ============ 认证服务 ============
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8082:8082"
    depends_on:
      - nacos
      - mysql
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
    networks:
      - ai-network

  # ============ 工单服务 ============
  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    ports:
      - "8083:8083"
    depends_on:
      - nacos
      - mysql
      - ai-service
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
    networks:
      - ai-network

  # ============ AI 服务 ============
  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8081:8081"
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      SPRING_AI_OPENAI_API_KEY: sk-ws-H.PIIEPIR.mHeL.MEQCIECvIpbOveKtoscbaMYD_Z13s0X894ERLdu-JgLCSEIlAiB_mSLiKZwE_QQbY6NhTYHWSXOTkGEJXRB7klRDeBjjwQ
    networks:
      - ai-network

  # ============ 前端 Nginx ============
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  mysql-data: