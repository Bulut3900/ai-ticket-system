services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: mysql-ticket
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ticket_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ai-network

  # Redis Stack（向量存储）
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
    networks:
      - ai-network

  # 后端 Spring Boot
  backend:
    build: ./backend
    container_name: ai-backend
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - redis
    networks:
      - ai-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      # 你的阿里云百炼 API Key
      SPRING_AI_OPENAI_API_KEY: your-api-key-here
      
  # 前端 Nginx
  frontend:
    build: ./frontend
    container_name: ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  mysql-data: